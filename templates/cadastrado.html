<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Realizado - Estúdio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">Estúdio</a>
        </div>
    </nav>

    <div class="container-md">
        {% if id == 1 %}
            <div class="card">
                <div class="alert alert-success">
                    <h2 class="card-title" style="margin: 0;">Cadastro Realizado</h2>
                    <p class="mb-0">Parabéns {{ nome }}, sua conta foi criada com sucesso. Faça login para continuar.</p>
                </div>

                <div class="card-footer flex-center gap-2" style="flex-wrap: wrap;">
                    <a href="/loguin" class="btn btn-primary">Entrar</a>
                    <a href="/" class="btn btn-outline">Voltar</a>
                </div>
            </div>
        {% endif %}
    </div>

    <footer>
        <p>&copy; 2024 Estúdio</p>
    </footer>
</body>
</html>
