<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Horários - Estúdio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">Estúdio</a>
            <div class="navbar-menu">
                <li class="navbar-item"><a href="/">Início</a></li>
                <li class="navbar-item"><a href="/logout" class="logout-btn">Sair</a></li>
            </div>
        </div>
    </nav>

    <div class="container-md">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Consultar Horários Disponíveis</h2>
            </div>

            <div class="card-body">
                <p class="text-center text-muted mb-3">Selecione a data para visualizar os horários</p>

                <form action="/consulta_agend" method="post">
                    <div class="form-group">
                        <label for="data_agend">Data</label>
                        <input type="date" id="data_agend" name="data_agend" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block mt-2">Verificar</button>
                </form>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="/" class="btn btn-outline">Voltar</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Estúdio</p>
    </footer>
</body>
</html>
