<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Estúdio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">Estúdio</a>
            <div class="navbar-menu">
                <li class="navbar-item"><a href="/">Início</a></li>
                <li class="navbar-item"><a href="/logout" class="logout-btn">Sair</a></li>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Meu Perfil</h2>
            </div>

            <div class="card-body">
                {% if atributos %}
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Email</th>
                                    <th>Telefone</th>
                                    <th>Senha</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for atributo in atributos %}
                                    <tr>
                                        <td>{{ atributo.nome }}</td>
                                        <td>{{ atributo.email }}</td>
                                        <td>{{ atributo.telefone }}</td>
                                        <td>••••••••</td>
                                        <td>
                                            <div class="flex gap-1">
                                                <form action="/pagina_edit_user" method="post" style="display: inline;">
                                                    <input type="hidden" name="id_edit_user" value="{{ atributo.id_usuario }}">
                                                    <button type="submit" class="btn btn-outline btn-sm">Editar</button>
                                                </form>
                                                <form action="/del_user" method="post" style="display: inline;">
                                                    <input type="hidden" name="id_del_user" value="{{ atributo.id_usuario }}">
                                                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Tem certeza que deseja deletar sua conta? Esta ação é irreversível!')">Deletar</button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                {% endif %}
            </div>

            <div class="card-footer">
                <a href="/" class="btn btn-outline">Voltar</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Estúdio</p>
    </footer>
</body>
</html>
