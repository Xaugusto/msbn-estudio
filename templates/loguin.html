<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Estúdio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">Estúdio</a>
            <ul class="navbar-menu">
                <li class="navbar-item"><a href="/">Início</a></li>
                <li class="navbar-item"><a href="/pagina_cadastro">Cadastrar</a></li>
            </ul>
        </div>
    </nav>

    <div class="container-sm">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Entrar</h2>
            </div>

            <div class="card-body">
                <form action="/loguin_sql" method="post">
                    <div class="form-group">
                        <label for="email_loguin">Email</label>
                        <input type="email" id="email_loguin" name="email_loguin" required placeholder="seu@email.com" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="senha_loguin">Senha</label>
                        <input type="password" id="senha_loguin" name="senha_loguin" required placeholder="Sua senha" autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block mt-2">Entrar</button>
                </form>
            </div>

            <div class="card-footer text-center">
                <p class="text-muted">Não tem conta? <a href="/pagina_cadastro">Cadastrar</a></p>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="/" class="btn btn-outline">Voltar</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Estúdio</p>
    </footer>
</body>
</html>
