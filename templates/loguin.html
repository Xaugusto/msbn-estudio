<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Estúdio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">✨ Estúdio</a>
            <ul class="navbar-menu">
                <li class="navbar-item"><a href="/">Home</a></li>
                <li class="navbar-item"><a href="/pagina_cadastro">Cadastro</a></li>
            </ul>
        </div>
    </nav>

    <!-- LOGIN FORM -->
    <div class="container-sm">
        <div class="card mt-3">
            <div class="card-header">
                <h2 class="card-title">Fazer Login</h2>
            </div>

            <div class="card-body p-3">
                <form action="/loguin_sql" method="post">
                    <div class="form-group">
                        <label for="email_loguin">📧 Email</label>
                        <input type="email" id="email_loguin" name="email_loguin" required placeholder="Seu email">
                    </div>

                    <div class="form-group">
                        <label for="senha_loguin">🔐 Senha</label>
                        <input type="password" id="senha_loguin" name="senha_loguin" required placeholder="Sua senha">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
                </form>
            </div>

            <div class="card-footer text-center">
                <p>Não tem conta? <a href="/pagina_cadastro">Cadastre-se agora</a></p>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="/" class="btn btn-outline">Voltar ao Home</a>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2024 Estúdio - Sistema de Agendamentos</p>
    </footer>
</body>
</html>
