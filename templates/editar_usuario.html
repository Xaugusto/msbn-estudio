<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Estúdio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">✨ Estúdio</a>
            <div class="navbar-menu">
                <li class="navbar-item"><a href="/">Home</a></li>
                <li class="navbar-item"><a href="/logout" class="logout-btn">Sair</a></li>
            </div>
        </div>
    </nav>

    <!-- EDIT FORM -->
    <div class="container-md">
        <div class="card mt-3">
            <div class="card-header">
                <h2 class="card-title">✏️ Editar Perfil</h2>
            </div>

            <div class="card-body p-3">
                {% for atributo in atributos %}
                    <form action="/edit_user" method="post">
                        <div class="form-group">
                            <label for="nome">👤 Nome Completo</label>
                            <input type="text" id="nome" name="nome" value="{{ atributo.nome }}" required>
                        </div>

                        <div class="form-group">
                            <label for="email">📧 Email</label>
                            <input type="email" id="email" name="email" value="{{ atributo.email }}" required>
                        </div>

                        <div class="form-group">
                            <label for="telefone">📱 Telefone</label>
                            <input type="tel" id="telefone" name="telefone" value="{{ atributo.telefone }}" required>
                        </div>

                        <div class="form-group">
                            <label for="senha">🔐 Senha</label>
                            <input type="password" id="senha" name="senha" value="{{ atributo.senha }}" required>
                        </div>

                        <input type="hidden" name="id_usuario_edit" value="{{ atributo.id_usuario }}">

                        <button type="submit" class="btn btn-primary btn-block">Salvar Alterações</button>
                    </form>
                {% endfor %}
            </div>

            <div class="card-footer">
                <a href="/perfil_user" class="btn btn-outline">Voltar</a>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2024 Estúdio - Sistema de Agendamentos</p>
    </footer>
</body>
</html>
