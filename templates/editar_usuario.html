<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Estúdio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">Estúdio</a>
            <div class="navbar-menu">
                <li class="navbar-item"><a href="/">Início</a></li>
                <li class="navbar-item"><a href="/logout" class="logout-btn">Sair</a></li>
            </div>
        </div>
    </nav>

    <div class="container-md">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Editar Perfil</h2>
            </div>

            <div class="card-body">
                {% for atributo in atributos %}
                    <form action="/edit_user" method="post">
                        <div class="form-group">
                            <label for="nome">Nome Completo</label>
                            <input type="text" id="nome" name="nome" value="{{ atributo.nome }}" required autocomplete="name">
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" value="{{ atributo.email }}" required autocomplete="email">
                        </div>

                        <div class="form-group">
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" name="telefone" value="{{ atributo.telefone }}" required autocomplete="tel">
                        </div>

                        <div class="form-group">
                            <label for="senha">Senha</label>
                            <input type="password" id="senha" name="senha" value="{{ atributo.senha }}" required autocomplete="current-password" minlength="6">
                        </div>

                        <input type="hidden" name="id_usuario_edit" value="{{ atributo.id_usuario }}">

                        <button type="submit" class="btn btn-primary btn-block mt-2">Salvar</button>
                    </form>
                {% endfor %}
            </div>

            <div class="card-footer">
                <a href="/perfil_user" class="btn btn-outline">Voltar</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Estúdio</p>
    </footer>
</body>
</html>
