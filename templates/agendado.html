<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Confirmado - Estúdio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">Estúdio</a>
            <div class="navbar-menu">
                <li class="navbar-item"><a href="/">Início</a></li>
                <li class="navbar-item"><a href="/logout" class="logout-btn">Sair</a></li>
            </div>
        </div>
    </nav>

    <div class="container-md">
        <div class="card">
            {% if var != none %}
                <div class="alert alert-success">
                    <h2 class="card-title" style="margin: 0;">Agendamento Confirmado</h2>
                    <p class="mb-0">Seu agendamento foi confirmado. Acompanhe na seção "Meus Agendamentos".</p>
                </div>
            {% else %}
                <div class="alert alert-info">
                    <h2 class="card-title" style="margin: 0;">Em Processamento</h2>
                </div>
            {% endif %}

            <div class="card-footer flex-center gap-2" style="flex-wrap: wrap;">
                <a href="/meus_agend" class="btn btn-primary">Meus Agendamentos</a>
                <a href="/pagina_consulta_agend" class="btn btn-outline">Agendar Mais</a>
                <a href="/" class="btn btn-outline">Voltar</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Estúdio</p>
    </footer>
</body>
</html>
